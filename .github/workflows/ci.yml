name: CI/CD Pipeline

on:
  # Ejecutar en pull requests hacia main y develop
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

  # Ejecutar en push a main
  push:
    branches: [main]

# Cancelar runs anteriores del mismo workflow si hay un nuevo push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job de validación de código
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: 🔧 Install dependencies
        run: npm ci

      - name: 🔍 Run ESLint
        run: |
          echo "🔍 Running ESLint..."
          npm run lint

      - name: 🏗️ Build check
        run: |
          echo "🏗️ Checking if project builds..."
          npm run build
        env:
          CI: true

      - name: ✅ Success message
        if: success()
        run: |
          echo "✅ All checks passed!"
          echo "🎉 Code quality validation successful"

  # Job para validar en PRs específicamente
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: code-quality

    steps:
      - name: 📝 PR Validation Summary
        run: |
          echo "✅ PR validation completed successfully!"
          echo "📋 Summary:"
          echo "  • ESLint validation: ✅ Passed"
          echo "  • Build validation: ✅ Passed"
          echo "  • Ready for review! 🚀"
