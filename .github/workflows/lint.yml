name: Lint Code

on:
  # Ejecutar en pull requests
  pull_request:
    branches: [main, develop]
  # Ejecutar en push a main
  push:
    branches: [main]

jobs:
  lint:
    name: ESLint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: ESLint Report
        if: failure()
        run: |
          echo "❌ ESLint found issues in the code"
          echo "Please fix the linting errors before merging"
          exit 1
