name: Quick Lint Check

on:
  pull_request:
    paths:
      - "src/**/*.js"
      - "src/**/*.jsx"
      - "src/**/*.ts"
      - "src/**/*.tsx"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.mjs"
      - ".eslintrc*"

jobs:
  quick-lint:
    name: Quick ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          # Solo necesitamos el commit actual para lint
          fetch-depth: 1

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: ⚡ Install dependencies (optimized)
        run: npm ci --prefer-offline --no-audit

      - name: 🚀 Run ESLint
        run: |
          echo "🚀 Running quick ESLint check..."
          npm run lint -- --max-warnings 0

      - name: 📊 Lint Results
        if: always()
        run: |
          if [ $? -eq 0 ]; then
            echo "✅ Lint check passed with no warnings!"
            echo "🎯 Code quality looks great!"
          else
            echo "❌ Lint check failed"
            echo "🔧 Please fix the issues above"
          fi
